name: brain (C++) + dane moda

# Dwie bramki, obie działają BEZ Space Engineers:
#  * brain — build bez llama.cpp (ZF_WITH_LLM=OFF) i ctest. To celowo ta sama ścieżka,
#    którą gracz dostaje bez modelu GGUF — i to ona zdążyła się po cichu zepsuć
#    (-Werror=unused-function), bo lokalnie budowaliśmy tylko wariant z LLM.
#    Submodułu llama.cpp NIE pobieramy: build bez niego ma działać z definicji.
#  * dane moda — walidator SBC. Gra nie mówi, że grupa spawnu wskazuje na nieistniejące
#    zachowanie; po prostu nic się nie spawnuje albo statek dryfuje. Tu wychodzi to
#    w kilka sekund, zamiast po pełnym wczytaniu świata.
# Czego CI nie sprawdzi: kompilacji moda (potrzebne zestawy z Bin64 — tools/sprawdz-mod.ps1
# lokalnie na Windowsie) ani niczego, co wymaga uruchomionej gry (patrz docs/testy-reczne.md).

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Konfiguracja CMake (bez LLM, warningi jako błędy)
        run: >
          cmake -S brain -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DZF_WITH_LLM=OFF
          -DZF_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      # ctest obejmuje testy jednostkowe ORAZ scenariusze z brain/tests/scenariusze/*.jsonl
      # (zdarzenia + oczekiwania w jednym pliku — patrz brain/src/scenariusz.hpp).
      - name: Testy (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test --replay (mostek + silnik bez gry)
        run: |
          mkdir -p /tmp/zf_storage
          cat > brain/configs/rules.local.toml <<'EOF'
          [bridge]
          storage_dir = "/tmp/zf_storage"
          db_path = "/tmp/zf_ci_state.sqlite3"
          EOF
          cat > /tmp/replay.jsonl <<'EOF'
          {"v":1,"seq":1,"ts":1000,"type":"session_start","data":{"world":"CI","player_id":1,"player_name":"CI","mod_version":"0.1"}}
          {"v":1,"seq":2,"ts":2000,"type":"combat_hit","data":{"attacker":1,"faction":"KRW","damage":900,"hits":12,"weapon":"gatling"}}
          {"v":1,"seq":3,"ts":9000,"type":"grid_destroyed","data":{"faction":"KRW","grid":"CI Test","by_player":true}}
          {"v":1,"seq":4,"ts":12000,"type":"debug_command","data":{"cmd":"rel"}}
          EOF
          # Brain zakłada katalog roboczy brain/ (configs/, personas/ względnie).
          cd brain && ../build/zf_brain --replay /tmp/replay.jsonl | tee /tmp/replay.log
          grep -q "replay zakończony" /tmp/replay.log
          grep -q "KRW" /tmp/replay.log

  dane-moda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Walidator SBC (referencje między plikami danych moda)
        run: python3 tools/waliduj_sbc.py

      # Walidator, który zawsze mówi „czysto", jest bezwartościowy — kontrtest psuje
      # dane na kopii i wymaga, żeby KAŻDA usterka została wykryta.
      - name: Kontrtest walidatora
        run: python3 tools/test_waliduj_sbc.py
