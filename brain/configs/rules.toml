# Reguły świata (hot-reload). Świat MŚCIWY.

[llm]
model_path = ""
use_gpu = true          # false => CPU (gdy SE zjada VRAM)
max_chars = 200

[bridge]
# storage_dir jest per maszyna — ustaw go w rules.local.toml (obok tego pliku,
# poza gitem). Wartości z rules.local.toml nadpisują te z rules.toml.
storage_dir = ""
poll_ms = 500
db_path = "state/zf_state.sqlite3"   # wzorzec nazwy bazy brain (offsety, relacje)
# Stan należy do KONKRETNEGO zapisu, więc z db_path robimy nazwę per świat:
# state/zf_state_<świat>_<hash storage>.sqlite3. Bez tego nowy świat dziedziczył
# relacje po poprzednim, a hybryda reputacji wpisywała je od razu do okna frakcji.
# false = jedna wspólna baza (zachowanie sprzed 2026-07-29).
db_per_swiat = true
rotate_bytes = 5242880               # 5 MB, próg rotacji plików JSONL

[relacje]
prog_sojusznik = 40
prog_wrogi = -30
prog_wojna = -60
histereza_wyjscie_z_wojny = -50
dryf_pkt = 1
dryf_co_minut = 120

[zmiany]
ostrzal_min = -5
ostrzal_max = -15
zniszczenie_statku = -30
zniszczenie_stacji = -50
sufit_po_zniszczeniu_stacji = 20
handel_min = 1
handel_max = 3
kontrakt_min = 10
kontrakt_max = 20
# Przyjęcie zlecenia to opowiedzenie się po czyjejś stronie: KAŻDA frakcja wroga
# wystawcy (relacja <= prog_wrogi) traci tyle zaufania do gracza. Kara jest jednorazowa
# na kontrakt. 0 = wyłącz (przyjmowanie zleceń nikogo nie obchodzi).
kontrakt_przyjety_u_wroga = -3
atak_na_wroga_bonus = 5
# Bonus "wróg mojego wroga" ma być nagrodą za potyczkę, nie dojną krową: mod zgłasza
# combat_hit co 3 s, więc bez cooldownu minuta ostrzału jednego statku robiła z gracza
# sojusznika wszystkich pozostałych frakcji. Cooldown per para (obserwator, ostrzelany).
atak_na_wroga_cooldown_min = 10
deeskalacja_bonus = 15   # przyjęty okup/kapitulacja/rozejm; trwałe modyfikatory (sufit) zostają
# Okup w KREDYTACH: oferta gracza >= progu wymusza pokój niezależnie od decyzji modelu
# (mały model potrafi w kółko mówić "dawaj więcej" i nigdy nie odpuścić). Brain przyjmuje
# tylko ofertę pokrytą saldem gracza — mod dosyła saldo w chat_message. 0 = wyłącz bramkę.
deeskalacja_prog_kredyty = 3000
# Im gorsza relacja, tym drożej: +1% progu za każdy punkt relacji poniżej zera.
deeskalacja_prog_za_punkt = 0.01

[tick]
co_minut = 4
szansa_zdarzenia_losowego = 0.35
budzet_akcji_na_tick = 1

[radio]
# 1/min = odstęp 60 s (za długo dla rozmowy — follow-up ginął). 6/min = 10 s:
# komfortowa rozmowa @frakcja i zjada dublowane wysyłki. Zmiana hot-reload.
# Dla snappier: 12 = 5 s. Zdarzenia bojowe mają osobny, stały cooldown 15 s.
limit_na_frakcje_na_min = 6
ttl_sekund = 120
# 5c: @FRAKCJA odpowiada tylko gdy jej statek jest w zasięgu radia (mod liczy dystans:
# clear <=6 km, weak/szum <=15 km, dalej = brak zasięgu). false = rozmowa zewsząd (test).
wymagaj_zasiegu = true

[reputacja]
# HYBRYDA: nasz silnik relacji (-100..+100) zostaje źródłem prawdy, ale jego wynik
# jest RZUTOWANY na natywną reputację SE (-1500..+1500). Dzięki temu gracz widzi stan
# relacji w zwykłym oknie frakcji (F1 -> Frakcje), a wieżyczki, ceny w sklepach i
# strefy stacji reagują na nasze wojny i sojusze. Bez tego były dwie liczby naraz:
# nasza (żywa) i vanillowa (martwa albo ruszana przez nagrody kontraktowe) — rozjazd.
# Odwzorowanie jest odcinkowo-liniowe i celuje w progi vanilli: nasze prog_wrogi (-30)
# ląduje na -500 (wróg w grze), a prog_sojusznik (+40) na +500 (sojusznik w grze).
sync = true
zakres = 1500     # |reputacja| w vanilli odpowiadająca naszemu ±100
prog = 500        # próg wroga/sojusznika w vanilli (dokumentacja SE: ±500)
polityka = true   # synchronizuj też relacje frakcja↔frakcja (SetReputation)

[ceny]
# Druga strona hybrydy reputacji. Tamta zmienia LICZBĘ w oknie frakcji, ta zmienia to,
# ile płacisz przy ladzie: sojusznik kupuje taniej, wróg płaci karę za to, że w ogóle
# go obsłużyli. Mod przechodzi po ofertach na bloku sklepu frakcji i przelicza im
# PricePerUnit z ceny BAZOWEJ (bazę pamięta u siebie, więc mnożniki się nie składają).
# Synchronizujemy tylko sklepy HEL/KRW/WGR — cennik stacji vanilla/MES należy do gry.
sync = true
mnoznik_wrog = 1.6         # ceny przy relacji -100 (o 60% drożej)
mnoznik_sojusznik = 0.8    # ceny przy relacji +100 (20% zniżki); relacja 0 => zawsze x1.0
# Cennik przestawia się skokowo, więc nie ma sensu gonić każdego drgnięcia relacji.
prog_zmiany = 0.02
# Świat mściwy: poniżej tej relacji frakcja nie handluje z tobą WCALE — mod zdejmuje
# oferty ze sklepu i odkłada je z powrotem dopiero, gdy relacja wróci powyżej progu.
# Wartość -101 wyłącza embargo (relacja nigdy tam nie zejdzie).
prog_embarga = -70

[kontrakty]
# Etap 6: frakcja sama wystawia zlecenia na swojej stacji (mod tworzy je przez
# MyAPIGateway.ContractSystem). To główna droga ODKUPIENIA — dryf leczy 1 pkt / 2 h,
# a wykonane zlecenie daje +kontrakt_max od ręki. prog_relacji: poniżej tej wartości
# frakcja nie chce mieć z tobą do czynienia (przy wojnie -60 i tak nie dostaniesz nic).
wlaczone = true
prog_relacji = -55
cooldown_min = 20
max_otwartych = 1
nagroda_min = 15000
nagroda_max = 60000
czas_min = 45
# Frakcja w napięciu/wojnie chce, żeby ktoś zrobił za nią brudną robotę: waga typu
# "nagroda" (za głowę) jest wtedy mnożona przez tę wartość. Nie włącza typu z wagą 0.
mnoznik_nagrody_w_napieciu = 3

# Rodzaje zleceń. Każdy ma inną klasę w Sandbox.ModAPI.Contracts, więc mod musi
# znaleźć w świecie CEL — i gdy go nie ma, wystawia dostawę (patrz docs/protocol.md):
#   dostawa      MyContractAcquisition  zdobądź towar i dostarcz na blok frakcji
#   nagroda      MyContractBounty       głowa pilota wrogiej frakcji (cel z polityki)
#   transport    MyContractHauling      ładunek z bloku frakcji na inny blok
#   naprawa      MyContractRepair       napraw uszkodzoną siatkę frakcji
#   poszukiwania MyContractSearch       znajdź siatkę w promieniu (zaginione/wrak)
#   wlasne       MyContractCustom       zlecenie z własną nazwą i opisem PL (SBC)
#
# Typu `eskorta` już tu nie ma (usunięty 2026-08-09): gra nie wozi definicji
# ContractTypeEscort, więc AddContract zwracało Error przy KAŻDEJ próbie. Nie da się go
# włączyć wagą — wróciłby dopiero z aktualizacją gry, a wtedy i tak trzeba by napisać go
# od nowa. Szczegóły ustalenia: CLAUDE.md, Etap 6.
#
# UWAGA co do `wlasne`: to JEDYNY typ nieprzewidziany wprost w dokumentacji API —
# wymaga definicji MyObjectBuilder_ContractTypeDefinition (mod/Data/ContractTypes.sbc),
# a zgłoszone bugi Keena mówią, że kontrakty custom nie ruszają reputacji vanilla
# (u nas nieszkodliwe — reputację prowadzi brain) i mogą źle pokazywać nazwę typu.
# Jeśli w grze okaże się kłopotliwy: ustaw tu `wlasne = 0`.

[kontrakty.typy]
# Wagi losowania (0 = typ wyłączony). Wartości domyślne dla wszystkich frakcji.
#
# nagroda stoi na 0 do czasu weryfikacji W GRZE (I14 w docs/testy-reczne.md): vanillowa
# nagroda za głowę jest mechaniką PvP (cel to inny GRACZ, dobicie bronią ręczną), więc
# zlecenie na tożsamość NPC może nie mieć jak się zaliczyć. Kod jest kompletny — po
# potwierdzeniu w grze wystarczy wpisać tu wagę (proponowane: nagroda 1, a u KRW 4).
dostawa = 3
nagroda = 0
transport = 2
naprawa = 1
poszukiwania = 1
# wlasne = 0 (2026-08-01, ROZSTRZYGNIĘTE W GRZE + dekompilacją): zlecenie custom NIE MA
# warunku wykonania. IMyContractCustom niesie tylko DefinitionId/EndBlockId/Name/Description,
# a podpięty MyContractConditionCustom kończy WYŁĄCZNIE mod przez
# IMyContractSystem.TryFinishCustomContract(id) — czego nie robimy. Gracz dostawał zlecenie
# bez zadania, które po czasie wygasało (kara relacji + przepadek kaucji). Do włączenia
# dopiero razem z własnym warunkiem po stronie moda. Uwaga: dla tego typu EndBlockId musi
# być BLOKIEM KONTRAKTÓW (gra: `as MyContractBlock` → Fail_BlockNotFound), a nasz
# FindHaulTarget schodzi na sklep — to osobna przyczyna odrzuceń.
wlasne = 0

[kontrakty.typy.HEL]
# Korporacja żyje logistyką: dostawy i transport, brudną robotę zleca rzadko.
dostawa = 4
transport = 3
poszukiwania = 1
naprawa = 1

[kontrakty.typy.KRW]
# Piraci: kruszec i szperanie po wrakach. Nie naprawiają cudzych wraków i nikogo nie
# eskortują. (Nagroda za głowę — ich naturalny typ — czeka na weryfikację, patrz wyżej.)
dostawa = 3
poszukiwania = 2
transport = 1
naprawa = 0
# wlasne = 0 JAWNIE, mimo że taka jest wartość domyślna wyżej. Do 2026-08-08 stało tu
# `wlasne = 2` i to nadpisanie WYGRYWAŁO z domyślnym zerem — piraci losowali typ opisany
# w całym repo jako wyłączony (~27% zleceń KRW), a gracz dostawał zadanie bez warunku
# wykonania, które wygasało na karę relacji i przepadek kaucji. Zero zostaje do czasu
# zaimplementowania TryFinishCustomContract po stronie moda; pilnuje tego dlug_test.
wlasne = 0

[kontrakty.typy.WGR]
# Górnicy: szyby się psują, koparki gubią, ruda musi dojechać.
naprawa = 4
dostawa = 3
poszukiwania = 3
transport = 2

[kontrakty.mnoznik]
# Trudność typu — mnoży NAGRODĘ w kredytach i zmianę relacji za wykonanie/zawalenie
# (kontrakt_min/kontrakt_max z [zmiany]). Trudniejsza robota szybciej odkupuje winy.
dostawa = 1.0
nagroda = 1.6
transport = 1.1
naprawa = 1.2
poszukiwania = 0.9
wlasne = 1.1

[spawn]
# Spawny statków frakcji sterowane maszyną stanów: przejście w napięcie -> patrol,
# w wojnę -> raid, losowe zdarzenie ticka -> convoy/patrol/raid wg stanu.
# wlaczone=false wyłącza auto-spawny (komenda /zf raid <frakcja> działa mimo to).
# cooldown_min: minimalny odstęp między auto-spawnami TEJ SAMEJ frakcji (anty-spam).
wlaczone = false
cooldown_min = 10

[okup_surowce]
# Okup w SUROWCACH (B+): w trakcie rajdu frakcja może zamiast gotówki zażądać
# TRYBUTU — konkretnego surowca dostarczonego do skrzynki zrzutu (GPS) w oknie
# czasu. Dostawa => pokój + relacja rośnie; brak dostawy => ataki trwają DALEJ +
# trwała utrata wiarygodności (świat mściwy: odkupienie czynem, nie czasem).
towary = "Iron,Nickel,Silicon,Cobalt"   # dozwolone surowce; brain losuje jeden, mod tłumaczy na SubtypeId + nazwę PL
ilosc_min = 50
ilosc_max = 100
deadline_s = 900         # 15 min na dostarczenie trybutu
bonus_dostawa = 20       # relacja += po dostarczeniu (jak wykonany kontrakt)
kara_zlamanie = 5        # relacja -= za złamaną obietnicę (główna kara to trwała nieufność)
